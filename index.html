<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer Luxury</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hud engine-off" id="hud">

        <section class="cluster">
            <div class="bezel"></div>
            <div class="face"></div>

            <svg class="dial" viewBox="0 0 360 360" aria-hidden="true">
                <defs>
                    <linearGradient id="needleGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop class="n-a" offset="0"/>
                        <stop class="n-b" offset="0.35"/>
                        <stop class="n-c" offset="1"/>
                    </linearGradient>
                </defs>

                <!-- cincin halus ala guilloche -->
                <circle class="hairline" cx="180" cy="180" r="170"/>
                <circle class="ring" cx="180" cy="180" r="84"/>
                <circle class="ring" cx="180" cy="180" r="64"/>
                <circle class="ring" cx="180" cy="180" r="44"/>

                <!-- skala kecepatan -->
                <circle id="redBand" class="red-band" cx="180" cy="180" r="162"/>
                <g id="ticks"></g>

                <!-- busur RPM -->
                <circle id="rpmTrack" class="rpm-track" cx="180" cy="180" r="104"/>
                <circle id="rpmArc" class="rpm-arc" cx="180" cy="180" r="104"/>

                <!-- segmen fuel dan health -->
                <g id="fuelSegs"></g>
                <g id="healthSegs"></g>

                <!-- jarum -->
                <g id="needle">
                    <polygon class="needle" points="150,177.4 180,175.8 324,179.3 324,180.7 180,184.2 150,182.6"/>
                </g>
            </svg>

            <!-- tutup poros jarum -->
            <div class="hub"></div>

            <div class="gear-box">
                <span class="mini">Gear</span>
                <span class="gear" id="gear">N</span>
            </div>

            <div class="speed-box">
                <span class="speed" id="speed">0</span>
                <span class="unit" id="speedUnit">mph</span>
            </div>

            <span class="ico lamp" id="headlights">
                <svg viewBox="0 0 24 24">
                    <path d="M11 6c5.5 0 9 2.5 9 6s-3.5 6-9 6c-2.2 0-3.5-3-3.5-6s1.3-6 3.5-6z"/>
                    <g class="beam-low"><path d="M2.5 9.5l3.5 1.3M2.5 13l3.5 1.3M2.5 16.5l3.5 1.3"/></g>
                    <g class="beam-high"><path d="M2.5 9h3.5M2.5 12h3.5M2.5 15h3.5"/></g>
                </svg>
            </span>

            <div class="odo-row">
                <span class="mini">Odo</span>
                <span class="odo" id="odometer">0000000</span>
                <span class="mini" id="odoUnit">mi</span>
            </div>

            <div class="bottom">
                <span class="meter-chip" id="fuelChip">
                    <svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h10M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V8l-3-3M6.5 7h5"/></svg>
                    <b id="fuel">100%</b>
                </span>
                <span class="ico" id="engine">
                    <svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
                </span>
                <span class="ico" id="seatbelts">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M8 21l1.2-8.5C9.5 10.5 10.5 9.5 12 9.5s2.5 1 2.8 3L16 21"/><path d="M9.2 10.5l6.3 7"/></svg>
                </span>
                <span class="meter-chip" id="healthChip">
                    <svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.7-8-10.6A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 8 2.5c0 5.9-8 10.6-8 10.6z"/></svg>
                    <b id="health">100%</b>
                </span>
            </div>

            <!-- animasi pembuka -->
            <div class="intro" id="intro">
                <svg class="intro-ring" viewBox="0 0 360 360" aria-hidden="true">
                    <circle cx="180" cy="180" r="165" pathLength="1"/>
                </svg>
                <div class="intro-text">
                    <span class="welcome">Welcome,</span>
                    <span class="owner" id="owner">Mr. McElwee</span>
                    <span class="divider"><i></i><b></b><i></i></span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
